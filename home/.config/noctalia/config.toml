[theme]
source = "wallpaper"

[theme.templates]
enable_builtin_templates = true
enable_community_templates = true
builtin_ids = [
  "gtk3", "gtk4", "ghostty"
]
community_ids = ["telegram", "steam"]

[bar.default]
scale = 1.2
padding = 12
thickness = 32
margin_edge = 4
margin_ends = 400
widget_spacing = 16

[control_center]
hidden_tabs = [
  "media", "weather", "screen-time"
]

[shell]
polkit_agent = true

[shell.panel]
open_near_click_control_center = true

[shell.launcher]
layout = "simple"
categories = true
category_icons_only = true

[shell.screenshot]
annotate = true
save_to_file = false
confirm_region = false
copy_to_clipboard = true
remember_last_region = false

[widget.launcher]
glyph = "brand-git"

[widget.wallpaper]
enabled = false

[widget.clock]
format = "%a, %d %b | %H:%M"

[widget.tray]
drawer = true

[widget.media]
enabled = false

[widget.clipboard]
enabled = false

[widget.network]
show_label = false

[widget.volume.actions]
scroll_up = "volume-up 1"
scroll_down = "volume-down 1"

[widget.control-center]
enabled = false
